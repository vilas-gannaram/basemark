<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Basemark — vanilla example</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<style>
			/* App-local override of theme.css's --font-sans only — the
			   --background/--foreground values now live in theme.css itself
			   (this app's palette became the shared default). `html:root`
			   (specificity 0,1,1) rather than `:root` (0,1,0) so this wins
			   regardless of whether Vite injects the theme.css import before or
			   after this inline <style> block in the head. */
			html:root {
				--font-sans: 'Onest', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			}

			/* Onest's default letter-spacing reads as too loose at heading sizes
			   (theme.css's h1-h6 rules don't set letter-spacing at all, since the
			   system-font stack they're written against doesn't need it). Scoped
			   here, not theme.css, since this is a correction for this specific
			   font, not a default every consumer should inherit. */
			h1,
			h2,
			h3,
			h4,
			h5,
			h6 {
				letter-spacing: -0.02em;
			}

			/* App chrome only (page nav) — not a Basemark component, so plain CSS
			   here rather than a shadow-DOM element. Reuses the same theme.css
			   custom properties every component reads, so it stays in sync with
			   whatever palette main.ts loads. */
			nav {
				display: flex;
				gap: 1rem;
				padding: 0.75rem 1.5rem;
				border-bottom: 1px solid var(--border, #e5e5e5);
				font-family: var(--font-sans);
			}
			nav a {
				text-decoration: none;
				font-size: var(--text-sm, 0.875rem);
				font-weight: 500;
				color: var(--muted-foreground, #737373);
				padding: 0.375rem 0.75rem;
				border-radius: var(--radius, 0.5rem);
			}
			nav a.active {
				color: var(--foreground, #171717);
				background: var(--muted, #f5f5f5);
			}
			#root {
				max-width: 860px;
				margin: 0 auto;
				padding: 1.5rem;
			}
		</style>
	</head>
	<body>
		<nav id="nav"></nav>
		<div id="root" class="typeset typeset-docs"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
