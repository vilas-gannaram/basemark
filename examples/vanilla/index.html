<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Basemark — vanilla example</title>
		<style>
			/* App chrome only (page nav) — not a Basemark component, so plain CSS
			   here rather than a shadow-DOM element. Reuses the same theme.css
			   custom properties every component reads, so it stays in sync with
			   whatever palette main.ts loads. */
			nav {
				display: flex;
				gap: 1rem;
				padding: 0.75rem 1.5rem;
				border-bottom: 1px solid var(--border, #e5e5e5);
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			}
			nav a {
				text-decoration: none;
				font-size: 0.875rem;
				font-weight: 500;
				color: var(--muted-foreground, #737373);
				padding: 0.375rem 0.75rem;
				border-radius: var(--radius, 0.5rem);
			}
			nav a.active {
				color: var(--foreground, #171717);
				background: var(--muted, #f5f5f5);
			}
			#root {
				max-width: 860px;
				margin: 0 auto;
				padding: 1.5rem;
			}
		</style>
	</head>
	<body>
		<nav id="nav"></nav>
		<div id="root"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
